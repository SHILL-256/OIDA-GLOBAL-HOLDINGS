<!DOCTYPE html>
<html>

<head>

<title>OIDA Account Dashboard</title>

<meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<style>

body{

font-family:Arial,sans-serif;
background:#f2f2f2;
height:100vh;
display:flex;
justify-content:center;
align-items:center;

}


.dashboard{

background:white;
width:400px;
padding:35px;
border-radius:15px;
box-shadow:0 5px 25px rgba(0,0,0,0.2);
text-align:center;

}


img{

width:120px;
margin-bottom:20px;

}


h2{

color:#28a745;

}


.user-info{

margin-top:20px;
background:#f5f5f5;
padding:15px;
border-radius:10px;

}


.logout{

margin-top:25px;
padding:12px 30px;
border:none;
background:#28a745;
color:white;
border-radius:25px;
cursor:pointer;

}


</style>

</head>


<body>


<div class="dashboard">


<img src="images/logo-half.png.jpeg">


<h2>
Welcome to OIDA
</h2>


<p>
Your Account Dashboard
</p>


<div class="user-info">

<p id="username">

Loading...

</p>


<p id="email">

Loading...

</p>


</div>



<button class="logout" id="logout">

Logout

</button>


</div>





<script type="module">


import { initializeApp }

from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";


import {

getAuth,

onAuthStateChanged,

signOut

}

from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";





const firebaseConfig = {


apiKey: "AIzaSyBFSC4axFPLk4b7ICzZYgBhjr9ApPgtSGk",

authDomain: "oida-global-holdings.firebaseapp.com",

projectId: "oida-global-holdings",

storageBucket: "oida-global-holdings.firebasestorage.app",

messagingSenderId: "986041249457",

appId: "1:986041249457:web:45ab6af92cf5994e317c90"

};



const app = initializeApp(firebaseConfig);


const auth = getAuth(app);





onAuthStateChanged(auth,(user)=>{


if(user){


document.getElementById("email").innerHTML =
"Email: " + user.email;


document.getElementById("username").innerHTML =
"User: " + (user.displayName || "OIDA Member");


}


else{


window.location.href="login.html";


}


});






document.getElementById("logout").addEventListener("click",()=>{


signOut(auth);


window.location.href="login.html";


});



</script>


</body>

</html>
