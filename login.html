<!DOCTYPE html>
<html>

<head>

<title>OIDA My Account</title>

<meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<style>

body {

    background:#f2f2f2;
    font-family:Arial, sans-serif;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;

}



.login-box {

    background:white;
    width:380px;
    padding:35px;
    border-radius:15px;
    box-shadow:0 5px 25px rgba(0,0,0,0.2);
    text-align:center;

}



.login-box img {

    width:120px;
    margin-bottom:20px;

}



h2 {

    color:#28a745;

}



p {

    color:#555;

}



.google-btn {

    width:100%;
    padding:13px;
    background:white;
    border:1px solid #ccc;
    border-radius:25px;
    cursor:pointer;
    font-weight:bold;
    font-size:16px;

}



.google-btn:hover {

    background:#f5f5f5;

}



.divider {

    margin:25px 0;
    color:#999;

}



.signup {

    margin-top:20px;

}



.signup a {

    color:#28a745;
    text-decoration:none;

}


</style>

</head>



<body>



<div class="login-box">


<img src="images/logo-half.png.jpeg" alt="OIDA Logo">


<h2>
Welcome to OIDA
</h2>


<p>
Sign in to access your account
</p>



<button class="google-btn">

🔵 Sign in with Google

</button>



<div class="divider">

OR

</div>



<p class="signup">

Don't have an account?

<a href="#">

Sign Up

</a>

</p>



</div>





<script type="module">


import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";


import {

getAuth,

GoogleAuthProvider,

signInWithPopup

} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";




const firebaseConfig = {


apiKey: "AIzaSyBFSC4axFPLk4b7ICzZYgBhjr9ApPgtSGk",

authDomain: "oida-global-holdings.firebaseapp.com",

projectId: "oida-global-holdings",

storageBucket: "oida-global-holdings.firebasestorage.app",

messagingSenderId: "986041249457",

appId: "1:986041249457:web:45ab6af92cf5994e317c90"


};




const app = initializeApp(firebaseConfig);


const auth = getAuth(app);



const provider = new GoogleAuthProvider();




document.querySelector(".google-btn").addEventListener("click",()=>{


signInWithPopup(auth, provider)


.then((result)=>{


alert("Welcome " + result.user.displayName);


window.location.href="index.html";


})


.catch((error)=>{


alert(error.message);


});


});



</script>



</body>

</html>
