<!DOCTYPE html>
<html>

<head>

<title>OIDA Create Account</title>

<meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<style>

body{

background:#f2f2f2;
font-family:Arial,sans-serif;
height:100vh;
display:flex;
justify-content:center;
align-items:center;

}


.signup-box{

background:white;
width:380px;
padding:35px;
border-radius:15px;
box-shadow:0 5px 25px rgba(0,0,0,0.2);
text-align:center;

}


.signup-box img{

width:120px;
margin-bottom:20px;

}


h2{

color:#28a745;

}


p{

color:#555;

}


.input-box{

text-align:left;
margin-top:20px;

}


label{

font-weight:bold;

}


input{

width:100%;
padding:12px;
margin-top:8px;
border:1px solid #ccc;
border-radius:8px;
box-sizing:border-box;

}



.signup-btn{

width:100%;
margin-top:25px;
padding:13px;
background:#28a745;
color:white;
border:none;
border-radius:25px;
cursor:pointer;
font-size:16px;

}



.back{

margin-top:20px;

}


.back a{

color:#28a745;
text-decoration:none;

}


</style>


</head>


<body>


<div class="signup-box">


<img src="images/logo-half.png.jpeg">


<h2>
Create Account
</h2>


<p>
Register your OIDA account
</p>

  <div class="input-box">

<label>
Full Name
</label>

<input type="text" id="name" placeholder="Enter your full name">

</div>


  
<div class="input-box">

<label>
Email
</label>

<input type="email" id="email" placeholder="Enter email">

</div>




<div class="input-box">

<label>
Password
</label>

<input type="password" id="password" placeholder="Create password">

</div>




<button class="signup-btn" id="signupBtn">

Create Account

</button>




<div class="back">

Already have an account?

<a href="login.html">
Login
</a>

</div>



</div>





<script type="module">


import { initializeApp }

from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";


import {

getAuth,

createUserWithEmailAndPassword,

updateProfile

}

from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";




const firebaseConfig = {


apiKey: "AIzaSyBFSC4axFPLk4b7ICzZYgBhjr9ApPgtSGk",

authDomain: "oida-global-holdings.firebaseapp.com",

projectId: "oida-global-holdings",

storageBucket: "oida-global-holdings.firebasestorage.app",

messagingSenderId: "986041249457",

appId: "1:986041249457:web:45ab6af92cf5994e317c90"

};





const app = initializeApp(firebaseConfig);


const auth = getAuth(app);




document.getElementById("signupBtn").addEventListener("click", async ()=>{


const name = document.getElementById("name").value;

const email = document.getElementById("email").value;

const password = document.getElementById("password").value;



try{


const userCredential = await createUserWithEmailAndPassword(

auth,

email,

password

);



await updateProfile(userCredential.user, {

displayName: name

});



alert("Account created successfully");


window.location.href="login.html";


}


catch(error){
    console.log(error.code);
    console.log(error.message);
    alert(error.code + "\n" + error.message);
}

});



</script>


</body>

</html>
