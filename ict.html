<!-- Request ICT Service -->

<section class="request-section">

<h2>Request an ICT Service</h2>

<p>
Fill in the form below and one of our ICT specialists will contact you as soon as possible.
</p>

<form class="request-form">

<label for="fullname">
Full Name
</label>

<input
type="text"
id="fullname"
name="fullname"
placeholder="Enter your full name"
required>



<label for="email">
Email Address
</label>

<input
type="email"
id="email"
name="email"
placeholder="Enter your email address"
required>



<label for="phone">
Phone Number
</label>

<input
type="tel"
id="phone"
name="phone"
placeholder="Enter your phone number"
required>



<label for="service">
Select ICT Service
</label>

<select
id="service"
name="service"
required>

<option value="">
-- Select a Service --
</option>

<option>
Software Development
</option>

<option>
IT Support
</option>

<option>
Network Installation
</option>

<option>
Cyber Security
</option>

<option>
Cloud Services
</option>

<option>
Server Management
</option>

</select>



<label for="message">
Project Description
</label>

<textarea
id="message"
name="message"
rows="6"
placeholder="Tell us about your project or ICT requirements..."
required></textarea>



<button type="submit">

<i class="fas fa-paper-plane"></i>

Submit Request

</button>

</form>

</section>
