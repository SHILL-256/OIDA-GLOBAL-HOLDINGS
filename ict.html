<!-- Request ICT Service -->

<section class="request-section">

<h2>Request an ICT Service</h2>

<p>
Please complete the form below and our ICT team will get back to you as soon as possible.
</p>

<form class="request-form">

<label for="fullname"><strong>Full Name</strong></label>
<input
type="text"
id="fullname"
name="fullname"
placeholder="Enter your full name"
required>

<label for="email"><strong>Email Address</strong></label>
<input
type="email"
id="email"
name="email"
placeholder="Enter your email address"
required>

<label for="phone"><strong>Phone Number</strong></label>
<input
type="tel"
id="phone"
name="phone"
placeholder="Enter your phone number"
required>

<label for="service"><strong>Select ICT Service</strong></label>

<select
id="service"
name="service"
required>

<option value="">-- Choose a Service --</option>

<option>Software Development</option>

<option>IT Support</option>

<option>Network Installation</option>

<option>Cyber Security</option>

<option>Cloud Infrastructure</option>

<option>Server Management</option>

<option>Network Solutions</option>

</select>

<label for="message"><strong>Project Description</strong></label>

<textarea
id="message"
name="message"
rows="6"
placeholder="Describe your ICT project or requirements..."
required></textarea>

<button type="submit">

<i class="fas fa-paper-plane"></i>

Submit Request

</button>

</form>

</section>
